<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى شخصي المفضل 🤍</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: Arial, Tahoma, sans-serif;
        overflow: hidden;
        color: #333;
    }

    .page {
        display: none;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 25px;
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.6s ease;
    }

    .page.active {
        display: flex;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
    }

    /* تأثير القلوب المتحركة */
    .heart-particle {
        position: absolute;
        color: rgba(255, 255, 255, 0.7);
        font-size: 20px;
        user-select: none;
        pointer-events: none;
        animation: floatUp 4s linear infinite;
        z-index: 1;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(100vh) scale(0.5) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(-10vh) scale(1.2) rotate(360deg);
            opacity: 0;
        }
    }

    /* الصفحة الأولى */
    #page1 {
        background: linear-gradient(135deg, #ff7ba0, #e91e63, #d81b60);
        color: white;
        flex-direction: column;
    }

    #page1 h1 {
        font-size: 32px;
        margin-bottom: 35px;
        font-weight: bold;
        z-index: 2;
    }

    .btn-yellow {
        border: none;
        background: #fff3a8;
        color: #5d4037;
        padding: 15px 45px;
        border-radius: 30px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        transition: 0.25s;
        z-index: 2;
    }

    .btn-yellow:active { transform: scale(0.92); }

    /* الصفحة الثانية */
    #page2 {
        position: relative;
        background-color: #fffdf5;
        overflow: hidden;
    }

    #page2::before, #page2::after {
        content: "";
        position: absolute;
        width: 140%;
        height: 80px;
        left: -20%;
        border-top: 5px solid rgba(255, 220, 80, 0.55);
        border-radius: 50%;
        transform: rotate(-4deg);
    }

    #page2::before {
        top: 8%;
        box-shadow: 0 45px 0 rgba(255, 220, 80, 0.35), 0 90px 0 rgba(255, 220, 80, 0.25);
    }

    #page2::after {
        bottom: 8%;
        transform: rotate(4deg);
        box-shadow: 0 45px 0 rgba(255, 220, 80, 0.35), 0 90px 0 rgba(255, 220, 80, 0.25);
    }

    .message-box {
        position: relative;
        z-index: 2;
        max-width: 650px;
        background: rgba(255,255,255,0.85);
        padding: 30px 24px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .message-box p {
        font-size: 19px;
        line-height: 2;
        margin: 0 0 25px;
    }

    /* صفحة الأسئلة */
    #page3 {
        background: linear-gradient(145deg, #fff2f6, #ffd5e3);
        flex-direction: column;
    }

    .question-box {
        width: 100%;
        max-width: 500px;
        background: rgba(255,255,255,0.92);
        padding: 35px 20px;
        border-radius: 30px;
        box-shadow: 0 12px 35px rgba(0,0,0,0.1);
        z-index: 2;
    }

    #question {
        font-size: 26px;
        margin: 0 0 30px;
        color: #d81b60;
    }

    .answers {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .answer-btn {
        border: none;
        background: #ff7fa8;
        color: white;
        padding: 14px 35px;
        border-radius: 25px;
        font-size: 19px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .answer-btn:active { transform: scale(0.92); }

    /* الصفحة الأخيرة */
    #page4 {
        background: linear-gradient(135deg, #ff8dae, #e91e63);
        color: white;
        flex-direction: column;
    }

    .heart {
        position: relative;
        width: 140px;
        height: 125px;
        margin-bottom: 35px;
        transform: rotate(-45deg);
        background: #ff2a55;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        z-index: 2;
    }

    .heart::before, .heart::after {
        content: "";
        position: absolute;
        width: 140px;
        height: 125px;
        background: #ff2a55;
        border-radius: 50%;
    }

    .heart::before { top: -70px; left: 0; }
    .heart::after { top: 0; left: 70px; }

    .heart-text {
        position: absolute;
        z-index: 5;
        transform: rotate(45deg);
        top: 35px;
